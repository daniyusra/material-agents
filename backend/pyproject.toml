[project]
name = "material-agents-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
    "langgraph>=1.0.0",
    "plotly>=5.0.0",
    "statsmodels>=0.14.0",
    "slowapi>=0.1.9",
    "python-json-logger>=2.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "apscheduler>=3.10.0,<4.0",
    "httpx>=0.27.0",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "pillow>=12.2.0",
    "nh3>=0.3.5",
    "mistune>=3.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
