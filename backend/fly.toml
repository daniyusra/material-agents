# fly.toml — Fly.io deployment config for the Material Agents backend.
# Generated as a template; adjust app name and region as needed.
# Deploy with: fly deploy

app = "material-agents-backend"   # change to your chosen app name
primary_region = "sin"            # Singapore — change to your nearest region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# Persistent volume for uploaded files (created separately with `fly volumes create`)
[mounts]
  source = "uploads_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 40

  [[services.http_checks]]
    interval = 10000
    timeout = 2000
    grace_period = "5s"
    method = "GET"
    path = "/health"
